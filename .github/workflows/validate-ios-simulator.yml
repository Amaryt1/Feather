name: Validate iOS Simulator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Feather for iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select supported Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            echo "::warning::Xcode 26.3.0 is not installed; using the runner's selected Xcode."
          fi
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather

      - name: Build iOS Simulator target
        run: |
          xcodebuild \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/FeatherDerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
