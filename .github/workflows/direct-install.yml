name: Direct install validation
on:
  push:
    branches: [feature/amaryt-direct-install-local]
  pull_request:
    paths:
      - 'Feather/**'
      - 'Zsign/**'
      - 'Tests/DirectInstall/**'
      - 'Tests/SourceOperations/**'
      - 'Tests/StoreActions/**'
      - '.github/workflows/direct-install.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Sign synthetic app and extension copies
        run: bash Tests/StoreActions/build-test-signer.sh "$RUNNER_TEMP"
      - run: bash Tests/DirectInstall/test-tls.sh
      - uses: actions/checkout@v4
        with:
          repository: weichsel/ZIPFoundation
          ref: 22787ffb59de99e5dc1fbfe80b19c97a904ad48d
          path: .zip-foundation
      - run: bash Tests/DirectInstall/test-archive.sh .zip-foundation
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check mandatory store update policy
        run: |
          swiftc Feather/DirectInstall/{StoreRelease,DirectPolicy}.swift Tests/StoreUpdate/PolicyTests.swift -o "$RUNNER_TEMP/store-update"
          "$RUNNER_TEMP/store-update"
      - name: Check clone validation and catalog ordering
        run: |
          swiftc Feather/Utilities/FirstLaunchDefaults.swift Feather/Views/Signing/ClonePolicy.swift Feather/DirectInstall/Direct{Policy,Profile}.swift Feather/Views/Apps/CatalogRank.swift Feather/Backend/Observable/SourceOperation.swift Tests/StoreActions/PolicyTests.swift -o "$RUNNER_TEMP/store-actions"
          "$RUNNER_TEMP/store-actions"
      - name: Test source operation identity and lifecycle
        run: |
          swiftc Feather/Backend/Observable/SourceOperation.swift Tests/SourceOperations/StateTests.swift -o "$RUNNER_TEMP/source-tests"
          "$RUNNER_TEMP/source-tests"
      - name: Run policy and handoff tests
        run: |
          swiftc Feather/DirectInstall/DirectPolicy.swift Feather/DirectInstall/DirectProfile.swift Tests/DirectInstall/PolicyTests.swift -o "$RUNNER_TEMP/direct-tests"
          "$RUNNER_TEMP/direct-tests"
      - name: Build unsigned for iOS
        run: xcodebuild -project Feather.xcodeproj -scheme Feather -configuration Debug -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build

  startup:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check archive structure validation
        run: python3 Tests/Startup/ArchiveTests.py
      - name: Verify storage recovery using Core Data
        run: |
          xcrun momc Feather/Backend/Storage/Feather.xcdatamodeld "$RUNNER_TEMP/Feather.momd"
          swiftc Feather/Backend/Storage/Storage.swift Tests/Startup/StorageTests.swift -o "$RUNNER_TEMP/startup-tests"
          "$RUNNER_TEMP/startup-tests" "$RUNNER_TEMP/Feather.momd"
      - name: Build Release for devices
        run: xcodebuild -project Feather.xcodeproj -scheme Feather -configuration Release -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Launch Debug on iPhone and iPad simulators
        run: bash Tests/Startup/simulator-smoke.sh
