name: Validate private four-feed catalog builder

on:
  pull_request:
    paths:
      - "scripts/build_private_apps_catalog.py"
      - ".github/workflows/refresh-private-apps-catalog.yml"
      - ".github/workflows/validate-private-apps-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile catalog builder
        run: python -m py_compile scripts/build_private_apps_catalog.py

      - name: Verify the four configured feeds and external catalog location
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "private_catalog_builder",
              "scripts/build_private_apps_catalog.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert len(module.FEEDS) == 4, module.FEEDS
          assert len({url for _, url in module.FEEDS}) == 4
          assert all(url.startswith("https://") for _, url in module.FEEDS)
          assert module.CATALOG_OUTPUT.as_posix().startswith("catalogs/private-apps/")
          assert not module.CATALOG_OUTPUT.as_posix().startswith("Feather/Resources/")
          print("Four unique feeds and external catalog output verified.")
          PY
