name: Apps catalog performance build

on:
  push:
    branches: [main]
    paths:
      - "Feather/Views/Apps/**"
      - "Feather/Backend/AppsCatalog/**"
      - "Feather/Backend/Observable/DownloadManager.swift"
      - "Feather/Resources/PrivateAppsCatalogSeed.json.gz"
      - "Feather/Resources/PrivateAppsCatalogSeedManifest.json"
      - "AltSourceKit/**"
      - "Feather.xcodeproj/**"
      - ".github/workflows/apps-catalog-build.yml"
      - "scripts/build_private_apps_catalog.py"
      - ".github/workflows/refresh-private-apps-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "Feather/Views/Apps/**"
      - "Feather/Backend/AppsCatalog/**"
      - "Feather/Backend/Observable/DownloadManager.swift"
      - "Feather/Resources/PrivateAppsCatalogSeed.json.gz"
      - "Feather/Resources/PrivateAppsCatalogSeedManifest.json"
      - "AltSourceKit/**"
      - "Feather.xcodeproj/**"
      - ".github/workflows/apps-catalog-build.yml"
      - "scripts/build_private_apps_catalog.py"
      - ".github/workflows/refresh-private-apps-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Compile catalog builder
        run: python -m py_compile scripts/build_private_apps_catalog.py

      - name: Verify the four configured feeds and external catalog location
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location(
              "private_catalog_builder",
              "scripts/build_private_apps_catalog.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert len(module.FEEDS) == 4, module.FEEDS
          assert len({url for _, url in module.FEEDS}) == 4
          assert all(url.startswith("https://") for _, url in module.FEEDS)
          assert module.CATALOG_OUTPUT.as_posix().startswith("catalogs/private-apps/")
          assert not module.CATALOG_OUTPUT.as_posix().startswith("Feather/Resources/")
          assert module.BUNDLED_CATALOG_OUTPUT.as_posix() == "Feather/Resources/PrivateAppsCatalogSeed.json.gz"
          assert module.BUNDLED_MANIFEST_OUTPUT.as_posix() == "Feather/Resources/PrivateAppsCatalogSeedManifest.json"

          # Validate the exact resources that will be packaged into the IPA.
          import gzip
          import hashlib
          import json

          bundled_catalog = module.BUNDLED_CATALOG_OUTPUT.read_bytes()
          bundled_manifest = json.loads(module.BUNDLED_MANIFEST_OUTPUT.read_text(encoding="utf-8"))
          digest = hashlib.sha256(bundled_catalog).hexdigest()
          assert bundled_manifest["schemaVersion"] == 1
          assert bundled_manifest["sourceCount"] == 4
          assert bundled_manifest["appCount"] > 0
          assert bundled_manifest["compressedBytes"] == len(bundled_catalog)
          assert bundled_manifest["sha256"] == digest

          payload = json.loads(gzip.decompress(bundled_catalog).decode("utf-8"))
          assert payload["schemaVersion"] == 1
          assert {source["sourceURL"] for source in payload["sources"]} == {url for _, url in module.FEEDS}
          assert len(payload["sources"]) == 4
          assert sum(len(source["repository"]["apps"]) for source in payload["sources"]) == bundled_manifest["appCount"]
          assert bundled_catalog == module.CATALOG_OUTPUT.read_bytes()
          print("Four feeds, bundled resources, app counts, and SHA-256 verified.")
          PY

      - name: Build and validate a live four-feed snapshot
        run: python scripts/build_private_apps_catalog.py

  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=iOS"
          - "generic/platform=macOS,variant=Mac Catalyst"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          fi
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Feather.xcodeproj \
            -scheme Feather

      - name: Build Feather
        run: |
          xcodebuild \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "${{ runner.temp }}/FeatherDerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
