name: Refresh bundled apps catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-apps-catalog.yml"

permissions:
  contents: write

# The catalog snapshot is generated only after all feeds have been validated.
concurrency:
  group: refresh-apps-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate offline catalog from all configured feeds
        run: python scripts/build_apps_catalog.py

      - name: Commit catalog when changed
        run: |
          git add -A Feather/Resources/AppsCatalog*
          if git diff --cached --quiet; then
            echo "Bundled catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bundled apps catalog snapshot"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
